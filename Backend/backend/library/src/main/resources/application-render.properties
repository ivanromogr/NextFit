# ===============================
# DATABASE (POSTGRES - RENDER)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / HIBERNATE

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true


# OPTIMIZACIÓN

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false


# CLOUDINARY

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:}
app.email.password-reset-url=${APP_PASSWORD_RESET_URL:}
app.email.email-change-confirm-url=${APP_EMAIL_CHANGE_CONFIRM_URL:}
app.email.resend-api-key=${RESEND_API_KEY:}

# Temporary, explicit deployment bootstrap. Off for normal restarts.
spring.sql.init.mode=${APP_MODERATION_SCHEMA_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:db/bootstrap/chat-safety.sql,classpath:db/bootstrap/moderation-panel.sql
app.moderation.bootstrap.enabled=${APP_MODERATION_BOOTSTRAP_ENABLED:false}
app.moderation.bootstrap.email=${APP_MODERATION_BOOTSTRAP_EMAIL:}
