spring.application.name=library
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:nextfit-api}
jwt.audience=${JWT_AUDIENCE:nextfit-clients}
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:60}
password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
app.email.enabled=${EMAIL_ENABLED:false}
app.email.provider=${EMAIL_PROVIDER:resend}
app.email.from=${EMAIL_FROM:}
app.email.password-reset-url=${APP_PASSWORD_RESET_URL:}
app.email.email-change-confirm-url=${APP_EMAIL_CHANGE_CONFIRM_URL:}
app.auth.email-change-ttl-minutes=${APP_AUTH_EMAIL_CHANGE_TTL_MINUTES:30}
app.auth.google.enabled=${GOOGLE_AUTH_ENABLED:false}
app.auth.google.allowed-audiences=${GOOGLE_AUTH_ALLOWED_AUDIENCES:${GOOGLE_WEB_CLIENT_ID:},${GOOGLE_IOS_CLIENT_ID:},${GOOGLE_ANDROID_CLIENT_ID:}}
app.auth.apple.enabled=${APPLE_AUTH_ENABLED:false}
app.auth.apple.allowed-audiences=${APPLE_AUTH_ALLOWED_AUDIENCES:}
app.email.resend-api-key=${RESEND_API_KEY:}
app.cleanup.enabled=${APP_CLEANUP_ENABLED:true}
app.cleanup.cron=${APP_CLEANUP_CRON:0 15 3 * * *}
app.cleanup.refresh-retention-days=${APP_CLEANUP_REFRESH_RETENTION_DAYS:30}
app.cleanup.password-reset-retention-days=${APP_CLEANUP_PASSWORD_RESET_RETENTION_DAYS:7}
app.cleanup.email-change-retention-days=${APP_CLEANUP_EMAIL_CHANGE_RETENTION_DAYS:7}
app.cleanup.orphan-upload-grace-hours=${APP_CLEANUP_ORPHAN_UPLOAD_GRACE_HOURS:24}
refresh-token.ttl-days=${REFRESH_TOKEN_TTL_DAYS:30}
refresh-token.cookie-name=${REFRESH_TOKEN_COOKIE_NAME:nextfit_refresh}
refresh-token.cookie-path=${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
refresh-token.cookie-secure=${REFRESH_TOKEN_COOKIE_SECURE:true}
refresh-token.cookie-same-site=${REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}
upload.storage-directory=${UPLOAD_STORAGE_DIRECTORY:uploads}
upload.profile-image-max-bytes=${UPLOAD_PROFILE_IMAGE_MAX_BYTES:5242880}
upload.chat-attachment-max-bytes=${UPLOAD_CHAT_ATTACHMENT_MAX_BYTES:10485760}
exercisedb.api.key=${EXERCISEDB_API_KEY:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.jackson.serialization.indent-output=true
spring.jpa.open-in-view=false
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health
