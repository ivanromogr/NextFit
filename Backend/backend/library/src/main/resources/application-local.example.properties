# Local development template. Keep real values in the ignored .env file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextfit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-details=always
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:}
app.email.password-reset-url=${APP_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.email.email-change-confirm-url=${APP_EMAIL_CHANGE_CONFIRM_URL:http://localhost:5173/confirm-email-change}
app.email.resend-api-key=${RESEND_API_KEY:}
server.address=0.0.0.0
