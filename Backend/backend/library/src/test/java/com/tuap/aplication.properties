# Nombre de la aplicación para el entorno de TEST
spring.application.name=backend-test


jwt.secret=ClaveDePruebaParaPasarElCheckDeSonar1234567890


# Esto evita que los tests busquen tu MySQL local
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NOT_FIXED_H2_COL_NAMES=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuración de subida de archivos para tests
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB