spring.application.name=nextfit-test

# Base64 for exactly 32 dummy bytes. It is only valid for the test profile.
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.issuer=nextfit-api-test
jwt.audience=nextfit-clients-test
jwt.access-token-ttl-seconds=900
jwt.clock-skew-seconds=60
password-reset.ttl-minutes=30
refresh-token.ttl-days=30
refresh-token.cookie-secure=false
upload.storage-directory=${java.io.tmpdir}/nextfit-test-uploads
upload.profile-image-max-bytes=5242880
upload.chat-attachment-max-bytes=10485760

spring.datasource.url=jdbc:h2:mem:nextfit-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoint.health.show-details=never
