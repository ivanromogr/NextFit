<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menú Cliente</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" 
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" 
          integrity="sha384-M9tH7RLsLGZ0a1GcuM6SIlNqKfefDUM8tlfKchj4wHukKZaY8XlEVvkl3Bd5zEYg" 
          crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Cliente</a>
        <div class="ml-auto">
            <a href="/logout" class="btn btn-outline-light">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">¡Bienvenido, <span th:text="${cliente.nombre}">Nombre</span>!</h2>

        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">Ver Perfil</h5>
                        <p class="card-text">Consulta tu información personal y objetivos.</p>
                        <a th:href="@{/cliente/perfil/{id}(id=${cliente.id})}" class="btn btn-primary">Ir al perfil</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 mb-3">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">Editar Perfil</h5>
                        <p class="card-text">Actualiza tu información personal.</p>
                        <a th:href="@{/cliente/perfil/{id}/editar(id=${cliente.id})}" class="btn btn-warning">Editar</a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">Ver Entrenamientos</h5>
                        <p class="card-text">Próximamente disponible.</p>
                        <a href="#" class="btn btn-secondary disabled">Próximamente</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" 
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-LtrjvnR4/Jqs9k9v8E/8rTpiFZBvZl/ig/3K6oj62Y5EprPQu3RZm0RCG/MDyTov" 
            crossorigin="anonymous"></script>
</body>
</html>
